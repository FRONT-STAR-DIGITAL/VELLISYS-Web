<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08143A">
  <meta name="robots" content="noindex">
  <title>You’re offline · Vellisys</title>
  <link rel="icon" href="assets/img/pwa-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/pwa-180.png">
  <style>
    :root { --navy:#08143a; --blue:#1E4EFF; --ink:#10182c; --muted:#5b6478; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      font-family: Montserrat, "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse 90% 55% at 86% 0%, rgba(30, 78, 255, .38) 0%, transparent 58%),
        radial-gradient(ellipse 70% 45% at 8% 100%, rgba(30, 78, 255, .16) 0%, transparent 52%),
        #08143a;
      overflow-x: hidden;
      position: relative;
    }
    .watermark {
      position: absolute;
      right: -22%;
      top: -6%;
      width: min(145%, 580px);
      height: auto;
      opacity: .42;
      pointer-events: none;
      z-index: 0;
      object-fit: contain;
      filter: brightness(1.12) saturate(1.05);
    }
    .card {
      width: min(420px, 100%);
      background: #fff;
      border-radius: 24px;
      padding: 36px 28px 28px;
      text-align: center;
      box-shadow: 0 18px 50px rgba(8, 20, 58, .18);
      position: relative;
      z-index: 1;
      overflow: hidden;
    }
    .card-mark {
      position: absolute;
      right: -16%;
      bottom: -22%;
      width: min(78%, 280px);
      height: auto;
      opacity: .14;
      pointer-events: none;
      z-index: 0;
      object-fit: contain;
    }
    .stack { position: relative; z-index: 1; }
    .logo {
      display: block;
      height: 40px;
      width: auto;
      max-width: 200px;
      margin: 0 auto 22px;
      object-fit: contain;
    }
    h1 { margin: 0 0 8px; font-size: 1.45rem; letter-spacing: -.02em; color: var(--navy); font-weight: 800; }
    p { margin: 0 0 22px; line-height: 1.55; color: var(--muted); font-size: .98rem; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #reload { background: var(--blue); color: #fff; }
    #reload:hover { filter: brightness(1.06); }
    #reload:disabled { opacity: .7; cursor: wait; }
    .hint { margin: 16px 0 0; font-size: .82rem; color: #8a93a6; }
  </style>
</head>
<body>
  <img class="watermark" src="assets/img/v-mark.png" alt="" decoding="async">
  <main class="card">
    <img class="card-mark" src="assets/img/v-mark.png" alt="" decoding="async">
    <div class="stack">
      <img class="logo" src="assets/img/vellisys-logo.png" alt="Vellisys" decoding="async">
      <h1>You’re offline</h1>
      <p>The internet dropped, or the connection is unstable. Vellisys needs a live connection to open the desk and your books.</p>
      <div class="actions">
        <button type="button" id="reload">Try again</button>
      </div>
      <p class="hint">When the network is back, tap Try again. This page does not use your books until you are online.</p>
    </div>
  </main>
  <script>
    (function () {
      var btn = document.getElementById('reload');
      function retry() {
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Connecting…';
        }
        location.reload();
      }
      if (btn) btn.addEventListener('click', retry);
      window.addEventListener('online', retry);
    })();
  </script>
</body>
</html>
