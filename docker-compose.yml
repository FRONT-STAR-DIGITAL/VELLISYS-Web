# Vellisys on Dokploy (Ubuntu VPS)
# Domains / SSL are set in the Dokploy UI (Traefik), not here.
#
# Important Dokploy volume rule: use ../files/... so data survives redeploys.

services:
  db:
    # MariaDB matches Hostinger dumps (collations like utf8mb4_uca1400_ai_ci).
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${FOLIO_DB_NAME:-vellisys}
      MYSQL_USER: ${FOLIO_DB_USER:-vellisys}
      MYSQL_PASSWORD: ${FOLIO_DB_PASS}
      MYSQL_ROOT_PASSWORD: ${FOLIO_DB_ROOT_PASS}
      MARIADB_AUTO_UPGRADE: "1"
    volumes:
      - ../files/mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FOLIO_LIVE: ${FOLIO_LIVE:-1}
      FOLIO_DB_HOST: db
      FOLIO_DB_NAME: ${FOLIO_DB_NAME:-vellisys}
      FOLIO_DB_USER: ${FOLIO_DB_USER:-vellisys}
      FOLIO_DB_PASS: ${FOLIO_DB_PASS}
    volumes:
      # Company logos, avatars, landing photos — survives git redeploys
      - ../files/uploads:/var/www/html/uploads
      # Schema-ready + short caches — survives container rebuilds
      - ../files/cache:/var/www/html/storage/cache
      # PHP sessions — Remember me / logins survive app redeploys
      - ../files/sessions:/var/www/html/storage/sessions
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
